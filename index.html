@media(pointer:fine){.ctrl{opacity:.45}}
</style>

<script>

var rooms={
 home:{name:"MY HOUSE",floor:"#d9c39b",wall:"#b98263",objects:[

   {id:"desk",x:115,y:90,w:74,h:42,col:"#b7895d",icon:"📚",msg:"Your school desk!"},
   {id:"draw",x:250,y:92,w:72,h:42,col:"#c88cc9",icon:"🎨",action:"draw",msg:"Drawing time!"},
   {id:"books",x:385,y:90,w:62,h:48,col:"#7d91bb",icon:"📖",msg:"You read a silly cat story!"},
   {id:"snack",x:115,y:182,w:66,h:38,col:"#d89b68",icon:"🍎",msg:"Snack time! Yum!"},
   {id:"playdoor",x:365,y:184,w:82,h:38,col:"#74a96c",icon:"🛝",goto:"park",msg:"Let's go to the playground!"},
   {id:"exit",x:240,y:238,w:72,h:28,col:"#805c43",icon:"🚪",exit:true,msg:"School is done for now!"}
 ]},
 market:{name:"MARKET",floor:"#e9c9b0",wall:"#b96e80",objects:[
   {id:"cupcakes",x:110,y:98,w:76,h:44,col:"#d8798e",icon:"🧁",msg:"You got a pretend cupcake! 🧁"},
   {id:"fruit",x:240,y:100,w:72,h:42,col:"#d6a65c",icon:"🍎",msg:"Fresh fruit!"},
   {id:"counter",x:365,y:110,w:72,h:48,col:"#9a6b4d",icon:"🐱",msg:"Shopkeeper: Welcome!"},
   {id:"exit",x:240,y:238,w:72,h:28,col:"#805c43",icon:"🚪",exit:true,msg:"Back to town!"}
 ]},
 park:{name:"SUNNY PAW PARK",floor:"#91c97c",wall:"#4f8055",objects:[
   {id:"slide",x:95,y:95,w:58,h:72,col:"#e6c74f",icon:"🛝",play:"slide",msg:"WHEEEE! You zoom down the slide!"},
   {id:"swings",x:210,y:88,w:72,h:58,col:"#78a7ce",icon:"🎠",play:"swings",msg:"Higher! Higher! Wheee!"},
   {id:"sandbox",x:340,y:100,w:82,h:56,col:"#e7cb82",icon:"🏖️",play:"sandbox",msg:"You build a cat-ear sand castle!"},
   {id:"seesaw",x:125,y:185,w:82,h:34,col:"#d98568",icon:"↕️",play:"seesaw",msg:"Up! Down! Up! Down!"},
   {id:"climber",x:300,y:185,w:78,h:44,col:"#8d74b5",icon:"🧗",play:"climber",msg:"You climb all the way to the top!"},
   {id:"exit",x:420,y:232,w:62,h:28,col:"#805c43",icon:"🚪",exit:true,msg:"Back to town!"}
 ]},
 forest:{name:"FOREST",floor:"#6f9d62",wall:"#396246",objects:[
   {id:"tree1",x:95,y:92,w:54,h:64,col:"#4f8055",icon:"🌳",tree:true,msg:"CHOP! The tree fell and gave you wood!"},
   {id:"tree2",x:165,y:115,w:54,h:64,col:"#4f8055",icon:"🌲",tree:true,msg:"CHOP! More wood for building!"},
   {id:"tree3",x:105,y:185,w:54,h:64,col:"#4f8055",icon:"🌳",tree:true,msg:"Timber! You got wood!"},
   {id:"apple",x:235,y:90,w:48,h:44,col:"#668b50",icon:"🍎",foodCritter:"apple",msg:"A wiggly apple-creature!"},
   {id:"toast",x:335,y:145,w:48,h:44,col:"#c49c65",icon:"🍞",foodCritter:"toast",msg:"A bouncy toast-creature!"},
   {id:"carrot",x:185,y:188,w:48,h:44,col:"#d58d52",icon:"🥕",foodCritter:"carrot",msg:"A hopping carrot-creature!"},
   {id:"exit",x:420,y:232,w:62,h:28,col:"#805c43",icon:"🚪",exit:true,msg:"Back to town!"}
 ]},
 lake:{name:"LAKE",floor:"#90bd79",wall:"#5c8fb0",objects:[
   {id:"dock",x:120,y:120,w:95,h:42,col:"#9b714b",icon:"🎣",msg:"You sit on the dock and watch the water."},
   {id:"frog",x:275,y:95,w:48,h:38,col:"#6da55c",icon:"🐸",msg:"Ribbit! The frog waves at you!"},
   {id:"boat",x:355,y:165,w:72,h:40,col:"#bd8255",icon:"🛶",msg:"You rock gently in the little boat!"},
   {id:"exit",x:420,y:232,w:62,h:28,col:"#805c43",icon:"🚪",exit:true,msg:"Back to town!"}
 ]}
};

function fit(){
 var vv=window.visualViewport,vw=Math.max(1,vv?vv.width:innerWidth),vh=Math.max(1,vv?vv.height:innerHeight);
 var aspect=vw/vh,base=BASE_W/BASE_H;
 if(aspect>=base){H=BASE_H;W=Math.round(H*aspect)}else{W=BASE_W;H=Math.round(W/aspect)}
 offX=Math.floor((W-BASE_W)/2);offY=Math.floor((H-BASE_H)/2);
 c.width=W;c.height=H;g.imageSmoothingEnabled=false;c.style.width=vw+"px";c.style.height=vh+"px";
}
fit();addEventListener("resize",fit);addEventListener("orientationchange",function(){setTimeout(fit,100)});

function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}
function text(t,x,y,size,col,align){g.fillStyle=col||"#3b2d28";g.font="bold "+(size||8)+"px monospace";g.textAlign=align||"left";g.fillText(t,x,y);g.textAlign="left"}
function emo(t,x,y,size){g.font=(size||14)+"px sans-serif";g.textAlign="center";g.fillText(t,x,y);g.textAlign="left"}
function tree(x,y){rect(x-4,y-16,8,18,"#795a3c");g.fillStyle="#4f8055";g.beginPath();g.arc(x,y-19,15,0,Math.PI*2);g.fill()}
function npc(o){rect(o.x-7,o.y-12,14,13,o.coat);rect(o.x-6,o.y-16,5,6,o.coat);rect(o.x+1,o.y-16,5,6,o.coat);rect(o.x-4,o.y-8,2,2,"#222");rect(o.x+2,o.y-8,2,2,"#222");rect(o.x-8,o.y,16,10,o.shirt);text(o.name,o.x,o.y-20,6,"#3b2d28","center")}
function player(){rect(p.x-8,p.y-11,16,16,"#f0e2cb");rect(p.x-7,p.y-16,5,6,"#e28a55");rect(p.x+2,p.y-16,5,6,"#888");rect(p.x-5,p.y-8,2,2,"#222");rect(p.x+3,p.y-8,2,2,"#222");rect(p.x-9,p.y+3,18,10,shirt)}

function drawTown(){
 rect(0,0,BASE_W,BASE_H,"#8fbd79");rect(213,0,54,270,"#dfc18c");rect(0,145,480,46,"#dfc18c");
 [20,68,116,164,308,356,404,452].forEach(function(x){tree(x,32);tree(x,250)});
 town.forEach(function(o){rect(o.x-o.w/2,o.y-o.h/2,o.w,o.h,o.col);rect(o.x-o.w/2+7,o.y+o.h/2-11,o.w-14,11,"#7b553d");text(o.label,o.x,o.y-3,8,"#fff","center");emo(o.icon,o.x,o.y+14,13)});
 people.forEach(npc);
}
function drawRoom(){
 var r=rooms[scene];rect(0,0,BASE_W,BASE_H,r.floor);rect(0,0,BASE_W,34,r.wall);text(r.name,240,23,13,"#fff","center");
 for(var i=0;i<r.objects.length;i++){var o=r.objects[i];if(o.foodCritter&&removed[o.foodCritter])continue;if(o.tree&&chopped[o.id])continue;rect(o.x-o.w/2,o.y-o.h/2,o.w,o.h,o.col);emo(o.icon,o.x,o.y+7,18);if(o.id!=="exit"){text(o.id.toUpperCase(),o.x,o.y-o.h/2-4,6,"#3b2d28","center");text("🐾",o.x+o.w/2-8,o.y-o.h/2+8,7,"#3b2d28","center")}}
}
function world(){
 rect(0,0,W,H,"#26382d");g.save();g.translate(offX,offY);
 if(scene==="town")drawTown();else drawRoom();
 for(var i=0;i<built;i++)emo("🏠",214+i*18,132,16);
 player();g.restore();
}
function ui(){
 rect(5,5,W-10,27,"#fff1cddd");text("🐱 WHISKERWOOD",12,22,11);text(scene==="town"?"TOWN":rooms[scene].name,W/2,22,8,"#3b2d28","center");text("⭐ "+coins,W-18,22,10,"#3b2d28","right");
 rect(8,H-32,W-16,25,"#fff1cddd");text(msg,15,H-15,8);
}
function near(x,y,r){return Math.hypot(p.x-x,p.y-y)<r}
function enter(where){scene=where;p.x=240;p.y=205;msg="You went into "+rooms[where].name+"!"}
function leave(){scene="town";p.x=240;p.y=170;msg="Back in Whiskerwood!"}
function hitTownAt(x,y){for(var i=town.length-1;i>=0;i--){var o=town[i];if(x>=o.x-o.w/2-10&&x<=o.x+o.w/2+10&&y>=o.y-o.h/2-10&&y<=o.y+o.h/2+10)return o}return null}
function hitRoomAt(x,y){var arr=rooms[scene].objects;for(var i=arr.length-1;i>=0;i--){var o=arr[i];if(o.foodCritter&&removed[o.foodCritter])continue;if(o.tree&&chopped[o.id])continue;if(x>=o.x-o.w/2&&x<=o.x+o.w/2&&y>=o.y-o.h/2&&y<=o.y+o.h/2)return o}return null}
function useObject(o){
 if(!o)return;
 if(o.exit){leave();return}
 if(o.goto){scene=o.goto;p.x=240;p.y=205;msg=o.msg;return}
 if(o.action==="draw"){msg=o.msg;openDraw();return}
 if(o.action==="closet"){msg=o.msg;openCloset();return}
 if(o.tree){if(!chopped[o.id]){chopped[o.id]=true;wood+=2;msg=o.msg+" 🪵 Wood: "+wood}else msg="That tree is already chopped.";return}
 if(o.play==="slide"){p.x=95;p.y=170;msg=o.msg;return}
 if(o.play==="swings"){p.x=210;p.y=120;msg=o.msg;return}
 if(o.play==="sandbox"){sandcastles++;msg=o.msg+" Castle #"+sandcastles+"!";return}
 if(o.play==="seesaw"){p.y=Math.max(60,p.y-28);msg=o.msg;return}
 if(o.play==="climber"){p.x=300;p.y=95;msg=o.msg;return}
 if(o.foodCritter){msg=o.msg+" Use your Cat Sword!";return}
 msg=o.msg||"You use it!";
}
function interact(){
 if(scene==="town"){
   var best=null,dist=999;
   town.forEach(function(o){var d=Math.hypot(p.x-o.x,p.y-o.y);if(d<82&&d<dist){best=o;dist=d}});
   if(best){enter(best.enter);if(best.id==="school"){if(!school){coins+=5;school=true}}return}
   people.forEach(function(o){var d=Math.hypot(p.x-o.x,p.y-o.y);if(d<40&&d<dist){best=o;dist=d}});
   if(best&&best.msg){msg=best.msg;return}
 }else{
   var arr=rooms[scene].objects,b=null,bd=999;
   arr.forEach(function(o){if(o.foodCritter&&removed[o.foodCritter])return;if(o.tree&&chopped[o.id])return;var d=Math.hypot(p.x-o.x,p.y-o.y);if(d<82&&d<bd){b=o;bd=d}});
   if(b){useObject(b);return}
 }
 msg="Walk closer or tap something!";
}
function update(){
 var sp=1.7;
 if(key.left)p.x-=sp;if(key.right)p.x+=sp;if(key.up)p.y-=sp;if(key.down)p.y+=sp;
 p.x=Math.max(10,Math.min(470,p.x));p.y=Math.max(38,Math.min(252,p.y));

 // Auto-enter doors/places when the player walks right up to them.
 if(scene==="town"){
   for(var i=0;i<town.length;i++){
     var o=town[i];
     var doorY=o.y+o.h/2;
     if(Math.abs(p.x-o.x)<Math.max(18,o.w*.32)&&Math.abs(p.y-doorY)<18){
       enter(o.enter);
       if(o.id==="school"&&!school){school=true;coins+=5}
       break;
     }
   }
 }else{
   var r=rooms[scene];
   for(var j=0;j<r.objects.length;j++){
     var q=r.objects[j];
     if(q.exit&&Math.abs(p.x-q.x)<24&&Math.abs(p.y-q.y)<14){leave();break}
     if(q.goto&&Math.abs(p.x-q.x)<36&&Math.abs(p.y-q.y)<24){scene=q.goto;p.x=240;p.y=205;msg=q.msg;break}
   }
 }
}
function loop(){update();world();ui();requestAnimationFrame(loop)}requestAnimationFrame(loop);

function bind(id,k){var b=document.getElementById(id);b.addEventListener("pointerdown",function(e){e.preventDefault();key[k]=true;b.setPointerCapture&&b.setPointerCapture(e.pointerId)});["pointerup","pointercancel","lostpointercapture"].forEach(function(ev){b.addEventListener(ev,function(){key[k]=false})})}
bind("left","left");bind("right","right");bind("up","up");bind("down","down");
(function(){
 var act=document.getElementById("act");
 act.addEventListener("pointerdown",function(e){e.preventDefault();interact();act.setPointerCapture&&act.setPointerCapture(e.pointerId)});
})();
addEventListener("keydown",function(e){if(e.key==="ArrowLeft"||e.key==="a")key.left=true;if(e.key==="ArrowRight"||e.key==="d")key.right=true;if(e.key==="ArrowUp"||e.key==="w")key.up=true;if(e.key==="ArrowDown"||e.key==="s")key.down=true;if(e.key==="e"||e.key==="Enter")interact()});
addEventListener("keyup",function(e){if(e.key==="ArrowLeft"||e.key==="a")key.left=false;if(e.key==="ArrowRight"||e.key==="d")key.right=false;if(e.key==="ArrowUp"||e.key==="w")key.up=false;if(e.key==="ArrowDown"||e.key==="s")key.down=false});

c.addEventListener("pointerdown",function(e){
 e.preventDefault();
 var r=c.getBoundingClientRect();
 var sx=(e.clientX-r.left)*W/r.width-offX,sy=(e.clientY-r.top)*H/r.height-offY;
 if(sx<0||sx>BASE_W||sy<0||sy>BASE_H)return;

 if(scene==="town"){
   var o=hitTownAt(sx,sy);
   if(o){enter(o.enter);if(o.id==="school"&&!school){school=true;coins+=5}return}
   for(var i=people.length-1;i>=0;i--){
     var n=people[i];
     if(Math.hypot(sx-n.x,sy-n.y)<28){msg=n.msg;return}
   }
 }else{
   var q=hitRoomAt(sx,sy);
   if(q){useObject(q);return}
 }
 msg="Tap an object or walk closer and press ACT!";
});

var bag=document.getElementById("bag"),items=document.getElementById("items");
function renderBag(){
 items.innerHTML="";
 var defs=[
   {key:"wood",label:"🪵 Wood",count:wood,action:"build"},
   {key:"sword",label:"⚔️ Cat Sword",count:1,action:"sword"},
   {key:"apple",label:"🍎 Apple",count:food.apple,action:"eat"},
   {key:"toast",label:"🍞 Toast",count:food.toast,action:"eat"},
   {key:"carrot",label:"🥕 Carrot",count:food.carrot,action:"eat"}
 ];
 defs.forEach(function(it){
   var r=document.createElement("div");r.className="row";
   var label=document.createElement("span");label.textContent=it.label+" × "+it.count;
   var b=document.createElement("button");b.type="button";
   b.textContent=it.action==="sword"?"USE":it.action==="build"?"BUILD":"EAT";
   if(it.count<=0&&it.action!=="sword")b.disabled=true;
   b.addEventListener("click",function(){useBagItem(it.key)});
   r.appendChild(label);r.appendChild(b);items.appendChild(r);
 });
}
function useBagItem(key){
 if(key==="sword"){closeBag();useSword();return}
 if(key==="wood"){
   if(wood<3){msg="You need 3 wood to build!";closeBag();return}
   wood-=3;built++;msg="You built a tiny cat house! 🏠";renderBag();return;
 }
 if(key==="apple"||key==="toast"||key==="carrot"){
   if(food[key]<=0)return;
   food[key]--;coins++;msg="Yum! You ate the "+key+"! 😺";renderBag();return;
 }
}
function openBag(){renderBag();bag.classList.add("open")}function closeBag(){bag.classList.remove("open")}
document.getElementById("bagBtn").onclick=openBag;document.getElementById("bagClose").onclick=closeBag;
document.getElementById("buildBtn").onclick=function(){useBagItem("wood")};
function useSword(){
 if(scene!=="forest"){msg="Your Cat Sword goes SWISH! ✨";return}
 var arr=rooms.forest.objects,hit=null;arr.forEach(function(o){if(o.foodCritter&&!removed[o.foodCritter]&&near(o.x,o.y,60))hit=o});
 if(!hit){msg="No food-creature close enough!";return}

var draw=document.getElementById("draw"),dc=document.getElementById("drawing"),dg=dc.getContext("2d"),drawing=false,last=null;
function openDraw(){draw.classList.add("open")}function closeDraw(){draw.classList.remove("open")}
document.getElementById("drawClose").onclick=closeDraw;document.getElementById("clearDraw").onclick=function(){dg.fillStyle="#fff";dg.fillRect(0,0,dc.width,dc.height)};
dg.fillStyle="#fff";dg.fillRect(0,0,dc.width,dc.height);dg.strokeStyle="#6d4a83";dg.lineWidth=5;dg.lineCap="round";
dc.addEventListener("pointerdown",function(e){drawing=true;last=null;dc.setPointerCapture&&dc.setPointerCapture(e.pointerId)});
dc.addEventListener("pointermove",function(e){if(!drawing)return;var r=dc.getBoundingClientRect(),x=(e.clientX-r.left)*dc.width/r.width,y=(e.clientY-r.top)*dc.height/r.height;if(last){dg.beginPath();dg.moveTo(last.x,last.y);dg.lineTo(x,y);dg.stroke()}last={x:x,y:y}});
["pointerup","pointercancel","lostpointercapture"].forEach(function(ev){dc.addEventListener(ev,function(){drawing=false;last=null})});
})();
</script>
