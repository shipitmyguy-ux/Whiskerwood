<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#26382d">
<title>Whiskerwood</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#26382d;font-family:monospace;touch-action:none;overscroll-behavior:none}
body{position:fixed;inset:0}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:0;pointer-events:none}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#8fbd79;max-width:none;max-height:none;pointer-events:auto}
.btn{position:fixed;width:clamp(46px,12vw,62px);height:clamp(46px,12vw,62px);border:2px solid #fff9;border-radius:16px;background:#3c5144cc;color:white;font:bold clamp(18px,5vw,25px) monospace;box-shadow:0 3px #0005;user-select:none;-webkit-user-select:none;touch-action:none;z-index:10}
.l{left:max(12px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom))}
.r{left:calc(max(12px,env(safe-area-inset-left)) + clamp(96px,26vw,132px));bottom:max(18px,env(safe-area-inset-bottom))}
.u{left:calc(max(12px,env(safe-area-inset-left)) + clamp(48px,13vw,66px));bottom:calc(max(18px,env(safe-area-inset-bottom)) + clamp(50px,13vw,66px))}
.d{left:calc(max(12px,env(safe-area-inset-left)) + clamp(48px,13vw,66px));bottom:max(18px,env(safe-area-inset-bottom))}
.a{right:max(16px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:clamp(64px,17vw,82px);height:clamp(64px,17vw,82px);border-radius:50%;background:#c76578dd;font-size:clamp(11px,3vw,15px)}
#error{position:fixed;inset:0;display:none;place-items:center;padding:24px;color:white;text-align:center;background:#26382d;z-index:50}
.hudBtn{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:20;width:48px;height:48px;border:2px solid #fff9;border-radius:14px;background:#fff1cddd;font-size:24px;touch-action:manipulation}.swordBtn{right:calc(max(12px,env(safe-area-inset-right)) + 56px)}
.panel{display:none;position:fixed;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,390px);max-height:80%;overflow:auto;background:#fff1cd;border:4px solid #765136;border-radius:18px;padding:12px;color:#3b2d28;box-shadow:0 8px 0 #0005}.panel.open{display:block}.panelHead{display:flex;align-items:center;justify-content:space-between;font-size:18px;margin-bottom:10px}.panel button{min-height:42px;border:2px solid #765136;border-radius:10px;background:#f5d999;color:#3b2d28;font:bold 14px monospace}.panelHead button{width:42px}.bagRow{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #76513655}.drawPanel{width:min(94vw,430px)}#drawing{display:block;width:100%;height:auto;background:#fff;border:2px solid #765136;border-radius:10px;touch-action:none}.drawActions{display:flex;gap:10px;align-items:center;margin-top:8px}
@media(pointer:fine){.btn{opacity:.35}}
@media(orientation:landscape) and (max-height:500px){.btn{width:48px;height:48px;font-size:19px}.a{width:64px;height:64px;font-size:11px}.l,.r,.d{bottom:max(8px,env(safe-area-inset-bottom))}.u{bottom:60px}.a{bottom:max(10px,env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="480" height="270"></canvas></div>
<button class="btn l" data-k="ArrowLeft" aria-label="move left">◀</button>
<button class="btn r" data-k="ArrowRight" aria-label="move right">▶</button>
<button class="btn u" data-k="ArrowUp" aria-label="move up">▲</button>
<button class="btn d" data-k="ArrowDown" aria-label="move down">▼</button>
<button class="btn a" data-k="e" aria-label="interact">🐾<br>ACT</button>
<button id="bagBtn" class="hudBtn" type="button" aria-label="open backpack">🎒</button>
<button id="swordBtn" class="hudBtn swordBtn" type="button" aria-label="use cat sword">⚔️</button>
<div id="bagPanel" class="panel" aria-live="polite">
  <div class="panelHead"><b>🎒 BACKPACK</b><button id="bagClose" type="button">✕</button></div>
  <div id="bagItems"></div>
  <button id="buildBtn" type="button">🪵 BUILD WITH WOOD</button>
</div>
<div id="drawPanel" class="panel drawPanel">
  <div class="panelHead"><b>🎨 DRAWING TIME</b><button id="drawClose" type="button">✕</button></div>
  <canvas id="drawing" width="300" height="170" aria-label="drawing canvas"></canvas>
  <div class="drawActions"><button id="clearDrawing" type="button">Clear</button><span>Draw with your finger!</span></div>
</div>
<div id="error">Whiskerwood could not load. Refresh to try again.</div>
<script>
(async()=>{
  // Cache-busting is intentional: child-directed edits should appear immediately on reload.
  const v=Date.now();
  const load=src=>new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src=src+"?v="+v;
    s.onload=resolve;
    s.onerror=reject;
    document.body.appendChild(s);
  });
  try{
    await load("game-data.js");
    await load("game.js");
  }catch(err){
    console.error(err);
    document.getElementById("error").style.display="grid";
  }
})();
</script>
</body>
</html>
