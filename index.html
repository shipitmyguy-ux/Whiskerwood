<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><title>Whiskerwood</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#26382d;font-family:monospace;touch-action:none}canvas{width:100vw;height:100vh;display:block;image-rendering:pixelated}.btn{position:fixed;width:58px;height:58px;border:2px solid #fff9;border-radius:16px;background:#3c5144cc;color:white;font:bold 24px monospace;box-shadow:0 3px #0005;user-select:none}.l{left:16px;bottom:25px}.r{left:142px;bottom:25px}.u{left:79px;bottom:88px}.d{left:79px;bottom:25px}.a{right:20px;bottom:30px;width:76px;height:76px;border-radius:50%;background:#c76578dd;font-size:15px}@media(pointer:fine){.btn{opacity:.35}}</style></head><body><canvas id='c' width='480' height='270'></canvas><button class='btn l' data-k='ArrowLeft'>◀</button><button class='btn r' data-k='ArrowRight'>▶</button><button class='btn u' data-k='ArrowUp'>▲</button><button class='btn d' data-k='ArrowDown'>▼</button><button class='btn a' data-k='e'>🐾<br>ACT</button><script>
const c=document.getElementById('c'),g=c.getContext('2d');g.imageSmoothingEnabled=false;const key={};let p={x:240,y:170},msg='Go to school! 🎒',school=false,coins=0;const spots=[{x:240,y:62,w:100,h:54,n:'SCHOOL',col:'#d89c72'},{x:85,y:78,w:90,h:58,n:'MY HOUSE',col:'#d8b17a'},{x:385,y:105,w:78,h:48,n:'MARKET',col:'#d8798e'},{x:390,y:210,w:92,h:48,n:'LAKE',col:'#71aeca'},{x:80,y:210,w:105,h:52,n:'FOREST',col:'#56825b'}];
addEventListener('keydown',e=>key[e.key]=1);addEventListener('keyup',e=>key[e.key]=0);document.querySelectorAll('.btn').forEach(b=>{let k=b.dataset.k;for(let ev of ['pointerdown'])b.addEventListener(ev,e=>{e.preventDefault();key[k]=1});for(let ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,e=>{e.preventDefault();key[k]=0})});let actWas=0;
function near(s){return Math.hypot(p.x-s.x,p.y-s.y)<58}function act(){let s=spots.find(near);if(!s){msg='Nothing to interact with here.';return}if(s.n==='SCHOOL'){school=true;msg='You made it to school! ⭐ Welcome, kitty!';coins+=5}else if(s.n==='MY HOUSE')msg='Home sweet home! 🏠';else if(s.n==='MARKET')msg='The market smells like cupcakes! 🧁';else if(s.n==='LAKE')msg='A frog waves from a lily pad! 🐸';else msg='A squirrel wants to play! 🐿️'}
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function txt(t,x,y,s=10,col='#3b2d28'){g.fillStyle=col;g.font=`bold ${s}px monospace`;g.fillText(t,x,y)}
function tree(x,y){rect(x-5,y-18,10,20,'#795a3c');g.fillStyle='#3f754c';g.beginPath();g.arc(x,y-20,18,0,7);g.fill();g.fillStyle='#6a9a62';g.beginPath();g.arc(x-8,y-26,9,0,7);g.fill()}
function cat(){let x=p.x,y=p.y;rect(x-8,y-11,16,16,'#f0e2cb');rect(x-7,y-16,5,6,'#e28a55');rect(x+2,y-16,5,6,'#888');rect(x-5,y-8,2,2,'#333');rect(x+3,y-8,2,2,'#333');rect(x-9,y+3,18,10,'#7396c8');rect(x-5,y+13,4,5,'#eee');rect(x+2,y+13,4,5,'#eee')}
function draw(){rect(0,0,480,270,'#8fbd79');rect(213,0,54,270,'#dfc18c');rect(0,145,480,46,'#dfc18c');for(let x=20;x<470;x+=48){tree(x,32);if(x<190||x>290)tree(x,250)}spots.forEach(s=>{rect(s.x-s.w/2,s.y-s.h/2,s.w,s.h,s.col);rect(s.x-s.w/2+8,s.y+s.h/2-13,s.w-16,13,'#7b553d');txt(s.n,s.x-s.n.length*3.5,s.y-4,9,'#fff');if(s.n==='SCHOOL'){txt('🕘',s.x-9,s.y+13,15)}});rect(5,5,470,27,'#fff1cddd');txt('🐱 WHISKERWOOD',12,22,11);txt(`⭐ ${coins}`,400,22,11);rect(7,36,180,38,'#fff1cddd');txt('TODAY:',14,50,8);txt(school?'✓ Go to school':'□ Go to school',14,65,9,school?'#39724b':'#3b2d28');cat();rect(8,238,464,25,'#fff1cddd');txt(msg,15,255,8)}
function loop(){let sp=1.7;p.x+=(key.ArrowRight?sp:0)-(key.ArrowLeft?sp:0);p.y+=(key.ArrowDown?sp:0)-(key.ArrowUp?sp:0);p.x=Math.max(12,Math.min(468,p.x));p.y=Math.max(45,Math.min(228,p.y));let a=key.e;if(a&&!actWas)act();actWas=a;draw();requestAnimationFrame(loop)}loop();
</script></body></html>
